name: Archive Portal 2 research screenshots
on:
  push:
    paths:
      - '.github/workflows/archive-research-images.yml'
      - 'scripts/cache-discord-screenshots.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out archive
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preserve original source screenshots
        run: python3 scripts/cache-discord-screenshots.py
      - name: Commit recovered research images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/ assets/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "Archive source-attributed Discord build screenshots locally"
            git push
          fi
